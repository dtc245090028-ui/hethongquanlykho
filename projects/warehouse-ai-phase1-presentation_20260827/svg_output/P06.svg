<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><text x="64" y="70" font-family="Aptos" font-size="16" fill="#00A6A6">03 · AI VÀ PROTOTYPE</text><text x="64" y="130" font-family="Aptos Display" font-size="40" font-weight="bold" fill="#12323A">Hai chức năng AI đã được thiết kế và test</text><line x1="64" y1="164" x2="1216" y2="164" stroke="#12323A" stroke-width="2"/><rect x="64" y="220" width="360" height="280" fill="#E9EFEA"/><text x="96" y="270" font-family="Aptos Display" font-size="27" font-weight="bold" fill="#00A6A6">BÁO CÁO KHO</text><text x="96" y="320" font-family="Aptos" font-size="21" fill="#263238">Tồn hiện tại</text><text x="96" y="355" font-family="Aptos" font-size="21" fill="#263238">Hàng dưới ngưỡng</text><text x="96" y="390" font-family="Aptos" font-size="21" fill="#263238">Biến động đáng chú ý</text><rect x="464" y="220" width="360" height="280" fill="#E9EFEA"/><text x="496" y="270" font-family="Aptos Display" font-size="27" font-weight="bold" fill="#00A6A6">GỢI Ý NHẬP</text><text x="496" y="320" font-family="Aptos" font-size="21" fill="#263238">Tồn hiện tại</text><text x="496" y="355" font-family="Aptos" font-size="21" fill="#263238">Mức tồn tối thiểu</text><text x="496" y="390" font-family="Aptos" font-size="21" fill="#263238">Lượng xuất 30 ngày</text><rect x="864" y="220" width="352" height="280" fill="#12323A"/><text x="896" y="270" font-family="Aptos Display" font-size="27" font-weight="bold" fill="#F7F5EF">PIPELINE</text><text x="896" y="320" font-family="Aptos" font-size="21" fill="#F7F5EF">Dữ liệu → Prompt</text><text x="896" y="355" font-family="Aptos" font-size="21" fill="#F7F5EF">→ Gemini → AI log</text><text x="896" y="405" font-family="Aptos" font-size="18" fill="#F7F5EF">prompt template riêng</text><text x="896" y="435" font-family="Aptos" font-size="18" fill="#F7F5EF">mock tests cho endpoint</text><rect x="64" y="560" width="1152" height="70" fill