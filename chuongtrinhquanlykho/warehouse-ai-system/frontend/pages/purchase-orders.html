<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đơn đặt hàng — Quản lý Kho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
  <div id="sidebar-container"></div>
  <div id="main-wrapper">
    <div id="topbar-container"></div>
    <main id="page-content">
      <div class="card mb-3">
        <div class="card-body py-2">
          <div class="row g-2 align-items-center">
            <div class="col-6 col-md-3">
              <select id="status-filter" class="form-select form-select-sm">
                <option value="">Tất cả trạng thái</option>
                <option value="chờ xác nhận">Chờ xác nhận</option>
                <option value="đã xác nhận">Đã xác nhận</option>
                <option value="đang giao">Đang giao</option>
                <option value="đã nhận">Đã nhận</option>
                <option value="hủy">Đã hủy</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <input type="number" id="supplier-filter" class="form-control form-control-sm" placeholder="ID Nhà cung cấp"/>
            </div>
            <div class="col-auto ms-md-auto">
              <button class="btn btn-primary btn-sm" id="btn-add">
                <i class="bi bi-plus-lg me-1"></i>Tạo đơn đặt hàng
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th>Mã ĐH</th>
                  <th>NCC ID</th>
                  <th class="d-none d-md-table-cell">Người tạo</th>
                  <th class="d-none d-md-table-cell">Ngày đặt</th>
                  <th>Trạng thái</th>
                  <th class="table-actions">Hành động</th>
                </tr>
              </thead>
              <tbody id="po-tbody">
                <tr><td colspan="6" class="text-center py-4 text-muted">Đang tải...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="card-footer"><div id="pagination-container"></div></div>
      </div>
    </main>
  </div>

  <!-- Modal Tạo PO -->
  <div class="modal fade" id="po-modal" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Tạo đơn đặt hàng mới</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="form-error" class="alert alert-danger d-none py-2"></div>
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label required">Nhà cung cấp</label>
              <input type="hidden" id="f-supplier"/>
              <button type="button" id="f-supplier-display" class="form-control supplier-picker-trigger text-start" aria-controls="supplier-picker" aria-expanded="false">
                <span class="text-muted">Chọn nhà cung cấp</span>
                <i class="bi bi-chevron-right float-end mt-1" aria-hidden="true"></i>
              </button>
            </div>
            <div class="col-md-4">
              <label class="form-label required">Ngày đặt hàng</label>
              <input type="datetime-local" id="f-date" class="form-control" required/>
            </div>
          </div>
          <hr/>
          <div class="d-flex justify-content-between align-items-center mb-2">
            <strong>Danh sách hàng đặt</strong>
            <button type="button" class="btn btn-sm btn-outline-primary" id="btn-add-item">
              <i class="bi bi-plus-lg me-1"></i>Thêm dòng
            </button>
          </div>
          <div class="table-responsive">
            <table class="table table-bordered table-sm" id="items-table">
              <thead class="table-light">
                <tr>
                  <th>Hàng hóa</th>
                  <th>Số lượng đặt</th>
                  <th>Đơn giá (VND)</th>
                  <th style="width:50px"></th>
                </tr>
              </thead>
              <tbody id="items-tbody"></tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="button" class="btn btn-primary" id="btn-save">
            <span id="save-spinner" class="spinner-border spinner-border-sm me-1 d-none"></span>Tạo đơn
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Thanh trượt chọn nhà cung cấp -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="supplier-picker" aria-labelledby="supplier-picker-title">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="supplier-picker-title">Chọn nhà cung cấp</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Đóng"></button>
    </div>
    <div class="offcanvas-body">
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
        <input type="search" id="supplier-search" class="form-control" placeholder="Tìm theo tên hoặc liên hệ..." autocomplete="off"/>
      </div>
      <div id="supplier-picker-status" class="small text-secondary mb-2"></div>
      <div id="supplier-picker-list" class="supplier-picker-list" role="listbox" aria-label="Danh sách nhà cung cấp"></div>
    </div>
  </div>

  <!-- Modal chi tiết PO -->
  <div class="modal fade" id="detail-modal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detail-title">Chi tiết đơn đặt hàng</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="detail-body">Đang tải...</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal cập nhật trạng thái -->
  <div class="modal fade" id="status-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Cập nhật trạng thái</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="status-po-id"/>
          <div id="status-error" class="alert alert-danger d-none py-2"></div>
          <label class="form-label">Trạng thái mới</label>
          <select id="new-status" class="form-select">
            <option value="chờ xác nhận">Chờ xác nhận</option>
            <option value="đã xác nhận">Đã xác nhận</option>
            <option value="đang giao">Đang giao</option>
            <option value="đã nhận">Đã nhận</option>
            <option value="hủy">Hủy</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="button" class="btn btn-primary" id="btn-status-save">Cập nhật</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    /* ========= Đơn đặt hàng (Purchase Orders) ========= */
    let currentPage = 1;
    const PAGE_SIZE = 20;
    let goodsOptions = [];
    let supplierOptions = [];
    const poModal     = new bootstrap.Modal(document.getElementById('po-modal'));
    const detailModal = new bootstrap.Modal(document.getElementById('detail-modal'));
    const statusModal = new bootstrap.Modal(document.getElementById('status-modal'));
    const supplierPicker = new bootstrap.Offcanvas(document.getElementById('supplier-picker'));

    async function loadGoodsOptions() {
      const data = await api.get('/goods', { page: 1, page_size: 1000, status: 'active' });
      goodsOptions = data.data || [];
    }

    async function loadSupplierOptions() {
      const status = document.getElementById('supplier-picker-status');
      const list = document.getElementById('supplier-picker-list');
      status.textContent = 'Đang tải danh sách...';
      list.innerHTML = '<div class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></div>';
      try {
        const data = await api.get('/suppliers', { page: 1, page_size: 1000, status: 'active' });
        supplierOptions = data.data || [];
        renderSupplierOptions();
      } catch (err) {
        status.textContent = 'Không thể tải danh sách nhà cung cấp.';
        list.innerHTML = `<div class="text-danger small">${utils.escapeHtml(err.message)}</div>`;
      }
    }

    function renderSupplierOptions() {
      const keyword = document.getElementById('supplier-search').value.trim().toLowerCase();
      const matches = supplierOptions.filter(supplier =>
        [supplier.name, supplier.contact_person, supplier.phone, supplier.email]
          .filter(Boolean)
          .some(value => value.toLowerCase().includes(keyword))
      );
      document.getElementById('supplier-picker-status').textContent =
        `${matches.length} nhà cung cấp${keyword ? ' phù hợp' : ''}`;
      document.getElementById('supplier-picker-list').innerHTML = matches.length
        ? matches.map(supplier => `
          <button type="button" class="supplier-picker-option" role="option" data-supplier-id="${supplier.id}" data-supplier-name="${utils.escapeHtml(supplier.name)}">
            <span class="supplier-picker-option-icon"><i class="bi bi-building" aria-hidden="true"></i></span>
            <span class="supplier-picker-option-copy">
              <strong>${utils.escapeHtml(supplier.name)}</strong>
              <small>${utils.escapeHtml(supplier.contact_person || supplier.phone || supplier.email || `Mã NCC #${supplier.id}`)}</small>
            </span>
            <i class="bi bi-check2 supplier-picker-check" aria-hidden="true"></i>
          </button>`).join('')
        : '<div class="text-secondary small py-3">Không tìm thấy nhà cung cấp phù hợp.</div>';
    }

    function resetSupplierPicker() {
      document.getElementById('f-supplier').value = '';
      document.getElementById('f-supplier-display').innerHTML = `
        <span class="text-muted">Chọn nhà cung cấp</span>
        <i class="bi bi-chevron-right float-end mt-1" aria-hidden="true"></i>`;
      document.getElementById('supplier-search').value = '';
    }

    function goodsOptionsHtml() {
      return '<option value="">Chọn hàng hóa</option>' + goodsOptions.map(goods => `
        <option value="${goods.id}" data-unit="${utils.escapeHtml(goods.unit)}" data-stock="${goods.quantity_on_hand}">
          ${utils.escapeHtml(goods.name)}
        </option>`).join('');
    }

    /* Tải danh sách PO */
    async function loadPOs(page = 1) {
      currentPage = page;
      const status = document.getElementById('status-filter').value;
      const supplier_id = document.getElementById('supplier-filter').value;
      document.getElementById('po-tbody').innerHTML =
        '<tr><td colspan="6" class="text-center py-4 text-muted">Đang tải...</td></tr>';
      try {
        const data = await api.get('/purchase-orders', { status, supplier_id, page, page_size: PAGE_SIZE });
        renderTable(data.data || []);
        utils.renderPagination('pagination-container', data.total, page, PAGE_SIZE, loadPOs);
      } catch (err) {
        document.getElementById('po-tbody').innerHTML =
          `<tr><td colspan="6" class="text-danger text-center py-4">Lỗi: ${utils.escapeHtml(err.message)}</td></tr>`;
      }
    }

    function renderTable(items) {
      if (!items.length) {
        document.getElementById('po-tbody').innerHTML =
          '<tr><td colspan="6" class="text-center py-4 text-muted">Không có dữ liệu</td></tr>';
        return;
      }
      document.getElementById('po-tbody').innerHTML = items.map(p => `
        <tr>
          <td><strong>#${p.id}</strong></td>
          <td>${p.supplier_id}</td>
          <td class="d-none d-md-table-cell">${p.created_by}</td>
          <td class="d-none d-md-table-cell">${utils.formatDate(p.order_date)}</td>
          <td>${utils.poBadge(p.status)}</td>
          <td class="table-actions">
            <button class="btn btn-outline-secondary btn-sm" onclick="viewDetail(${p.id})" title="Xem chi tiết">
              <i class="bi bi-eye"></i>
            </button>
            ${p.status !== 'đã nhận' && p.status !== 'hủy' ? `
            <button class="btn btn-outline-primary btn-sm ms-1" onclick="openStatusModal(${p.id}, '${p.status}')" title="Cập nhật trạng thái">
              <i class="bi bi-arrow-repeat"></i>
            </button>` : ''}
          </td>
        </tr>`).join('');
    }

    /* Xem chi tiết PO */
    async function viewDetail(id) {
      document.getElementById('detail-body').innerHTML = '<div class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></div>';
      document.getElementById('detail-title').textContent = `Đơn đặt hàng #${id}`;
      detailModal.show();
      try {
        const p = await api.get(`/purchase-orders/${id}`);
        if (!goodsOptions.length) await loadGoodsOptions();
        const itemsHtml = (p.items || []).map((it, i) => `
          <tr>
            <td>${i+1}</td>
            <td>${utils.escapeHtml(goodsOptions.find(g => String(g.id) === String(it.goods_id))?.name || 'Không xác định')}</td>
            <td>${utils.formatQty(it.quantity_ordered)}</td>
            <td>${utils.formatCurrency(it.unit_price)}</td>
            <td>${utils.formatCurrency(it.quantity_ordered * it.unit_price)}</td>
          </tr>`).join('');
        document.getElementById('detail-body').innerHTML = `
          <div class="row mb-3">
            <div class="col-md-6">
              <table class="table table-borderless mb-0 small">
                <tr><th>Nhà cung cấp:</th><td>${p.supplier_id}</td></tr>
                <tr><th>Người tạo:</th><td>${p.created_by}</td></tr>
                <tr><th>Ngày đặt:</th><td>${utils.formatDate(p.order_date)}</td></tr>
              </table>
            </div>
            <div class="col-md-6">
              <table class="table table-borderless mb-0 small">
                <tr><th>Trạng thái:</th><td>${utils.poBadge(p.status)}</td></tr>
              </table>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-sm table-bordered">
              <thead class="table-light"><tr><th>#</th><th>Hàng hóa</th><th>SL đặt</th><th>Đơn giá</th><th>Thành tiền</th></tr></thead>
              <tbody>${itemsHtml}</tbody>
            </table>
          </div>`;
      } catch (err) {
        document.getElementById('detail-body').innerHTML = `<div class="text-danger">Lỗi: ${utils.escapeHtml(err.message)}</div>`;
      }
    }

    /* Mở modal cập nhật trạng thái */
    function openStatusModal(id, currentStatus) {
      document.getElementById('status-po-id').value = id;
      document.getElementById('new-status').value = currentStatus;
      document.getElementById('status-error').classList.add('d-none');
      statusModal.show();
    }

    /* Lưu trạng thái */
    document.getElementById('btn-status-save').addEventListener('click', async () => {
      const id = document.getElementById('status-po-id').value;
      const status = document.getElementById('new-status').value;
      const errDiv = document.getElementById('status-error');
      errDiv.classList.add('d-none');

      if (status === 'hủy') {
        const ok = await utils.confirmDialog('Hủy đơn hàng', 'Bạn có chắc muốn hủy đơn đặt hàng này?');
        if (!ok) return;
      }

      try {
        await api.put(`/purchase-orders/${id}/status`, { status });
        utils.showToast('Cập nhật trạng thái thành công!', 'success');
        statusModal.hide();
        loadPOs(currentPage);
      } catch (err) {
        errDiv.textContent = 'Lỗi: ' + err.message;
        errDiv.classList.remove('d-none');
      }
    });

    /* Thêm dòng item vào bảng */
    function addItemRow() {
      const tbody = document.getElementById('items-tbody');
      const idx = tbody.rows.length;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><select class="form-select form-select-sm" name="goods_id">${goodsOptionsHtml()}</select></td>
        <td><div class="issue-quantity-control"><input type="number" class="form-control form-control-sm" name="qty" min="1" value="1" placeholder="Số lượng"/><span class="issue-stock-hint">Đang có: —</span></div></td>
        <td><input type="number" class="form-control form-control-sm" name="price" min="0" value="0" placeholder="Đơn giá"/></td>
        <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">
          <i class="bi bi-trash"></i>
        </button></td>`;
      tbody.appendChild(tr);
    }

    document.getElementById('items-tbody').addEventListener('change', event => {
      if (event.target.name !== 'goods_id') return;
      const option = event.target.selectedOptions[0];
      const hint = event.target.closest('tr').querySelector('.issue-stock-hint');
      hint.textContent = option.value ? `Đang có: ${utils.formatQty(option.dataset.stock)} ${option.dataset.unit}` : 'Đang có: —';
    });

    document.getElementById('btn-add-item').addEventListener('click', addItemRow);

    document.getElementById('f-supplier-display').addEventListener('click', async () => {
      supplierPicker.show();
      if (!supplierOptions.length) await loadSupplierOptions();
      else renderSupplierOptions();
    });

    document.getElementById('supplier-search').addEventListener('input', utils.debounce(renderSupplierOptions, 150));
    document.getElementById('supplier-picker-list').addEventListener('click', event => {
      const option = event.target.closest('[data-supplier-id]');
      if (!option) return;
      document.getElementById('f-supplier').value = option.dataset.supplierId;
      document.getElementById('f-supplier-display').innerHTML = `
        <span>${option.dataset.supplierName}</span>
        <i class="bi bi-chevron-right float-end mt-1" aria-hidden="true"></i>`;
      supplierPicker.hide();
    });

    /* Mở modal tạo PO */
    document.getElementById('btn-add').addEventListener('click', async () => {
      resetSupplierPicker();
      document.getElementById('f-date').value = new Date().toISOString().slice(0, 16);
      document.getElementById('items-tbody').innerHTML = '';
      document.getElementById('form-error').classList.add('d-none');
      try {
        await loadGoodsOptions();
        addItemRow(); // Thêm 1 dòng mặc định
        poModal.show();
      } catch (err) {
        const errDiv = document.getElementById('form-error');
        errDiv.textContent = 'Không thể tải danh sách hàng hóa: ' + err.message;
        errDiv.classList.remove('d-none');
        poModal.show();
      }
    });

    /* Lưu PO mới */
    document.getElementById('btn-save').addEventListener('click', async () => {
      const supplierId = document.getElementById('f-supplier').value;
      const orderDate  = document.getElementById('f-date').value;
      const errDiv = document.getElementById('form-error');
      errDiv.classList.add('d-none');

      if (!supplierId || !orderDate) {
        errDiv.textContent = 'Vui lòng nhập đầy đủ Nhà cung cấp và Ngày đặt hàng.';
        errDiv.classList.remove('d-none');
        return;
      }

      /* Thu thập items */
      const rows = document.getElementById('items-tbody').rows;
      const items = [];
      for (const row of rows) {
        const goods_id = row.querySelector('[name=goods_id]').value;
        const qty      = row.querySelector('[name=qty]').value;
        const price    = row.querySelector('[name=price]').value;
        if (!goods_id || !qty || parseFloat(qty) <= 0) {
          errDiv.textContent = 'Mỗi dòng hàng phải chọn hàng hóa và có số lượng > 0.';
          errDiv.classList.remove('d-none');
          return;
        }
        items.push({ goods_id: parseInt(goods_id), quantity_ordered: parseFloat(qty), unit_price: parseFloat(price) || 0 });
      }

      if (!items.length) {
        errDiv.textContent = 'Đơn đặt hàng phải có ít nhất 1 mặt hàng.';
        errDiv.classList.remove('d-none');
        return;
      }

      document.getElementById('save-spinner').classList.remove('d-none');
      document.getElementById('btn-save').disabled = true;

      try {
        await api.post('/purchase-orders', {
          supplier_id: parseInt(supplierId),
          order_date: new Date(orderDate).toISOString(),
          items,
        });
        utils.showToast('Tạo đơn đặt hàng thành công!', 'success');
        poModal.hide();
        loadPOs(currentPage);
      } catch (err) {
        errDiv.textContent = 'Lỗi: ' + err.message;
        errDiv.classList.remove('d-none');
      } finally {
        document.getElementById('save-spinner').classList.add('d-none');
        document.getElementById('btn-save').disabled = false;
      }
    });

    document.getElementById('status-filter').addEventListener('change', () => loadPOs(1));
    document.getElementById('supplier-filter').addEventListener('input', utils.debounce(() => loadPOs(1), 400));

    document.addEventListener('DOMContentLoaded', () => {
      setPageTitle('Đơn đặt hàng');
      loadPOs(1);
    });
  </script>
</body>
</html>
