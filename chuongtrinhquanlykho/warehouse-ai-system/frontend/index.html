<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng nhập — Quản lý Kho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body {
      background: var(--bg-base);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
      position: relative;
      overflow: hidden;
    }

    /* Quiet parchment texture for the entry screen */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(196,137,59,0.08), transparent 42%),
                  linear-gradient(315deg, rgba(139,94,60,0.06), transparent 48%);
      pointer-events: none;
    }

    /* Warm ambient accent */
    body::after {
      content: '';
      position: fixed;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(196,137,59,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-wrapper {
      width: 420px;
      max-width: 100%;
      position: relative;
      z-index: 1;
    }

    /* Brand header */
    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-brand .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background: var(--accent-yellow);
      color: #3b2314;
      font-size: 1.5rem;
      font-weight: 700;
      border-radius: 4px;
      margin-bottom: 1rem;
      box-shadow: 0 8px 18px rgba(59,35,20,0.15);
    }

    .login-brand h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.25rem;
    }

    .login-brand p {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: 'Manrope', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 0;
    }

    /* Login card */
    .login-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 2rem;
      position: relative;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-yellow), transparent);
    }

    .login-card .section-tag {
      font-size: 0.65rem;
      font-family: 'Manrope', sans-serif;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .login-card .section-tag::before { content: '[ '; color: var(--accent-yellow); }
    .login-card .section-tag::after  { content: ' ]'; color: var(--accent-yellow); }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.68rem;
      font-family: 'Space Mono', monospace;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .login-footer span { color: var(--accent-yellow); }

    .btn-login {
      background: var(--accent-yellow);
      border: none;
      color: #3b2314;
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.65rem 1.5rem;
      border-radius: 2px;
      width: 100%;
      transition: all 0.15s ease;
    }

    .btn-login:hover {
      background: #d4a04c;
      color: #3b2314;
      box-shadow: 0 6px 16px rgba(139,94,60,0.2);
    }

    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Status indicator */
    .sys-status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.65rem;
      font-family: 'Manrope', sans-serif;
      color: var(--accent-green);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .sys-status .dot {
      width: 6px; height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
      animation: blink 1.5s infinite;
      box-shadow: 0 0 4px rgba(45,95,58,0.35);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <!-- Brand -->
    <div class="login-brand">
      <div class="brand-logo"><i class="bi bi-boxes"></i></div>
      <h1>Warehouse AI System</h1>
      <p>// Hệ thống quản lý kho thông minh</p>
    </div>

    <!-- Login card -->
    <div class="login-card">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="section-tag">AUTH_ACCESS</div>
        <div class="sys-status"><span class="dot"></span>SYS_ONLINE</div>
      </div>

      <!-- Thông báo lỗi -->
      <div id="login-error" class="alert alert-danger d-none py-2" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span id="login-error-msg"></span>
      </div>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">
            <i class="bi bi-person-fill me-1"></i>Tên đăng nhập
          </label>
          <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập"
                 autocomplete="username" required/>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">
            <i class="bi bi-lock-fill me-1"></i>Mật khẩu
          </label>
          <div class="input-group">
            <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu"
                   autocomplete="current-password" required/>
            <button class="btn btn-outline-secondary" type="button" id="toggle-pwd" title="Hiện/ẩn mật khẩu">
              <i class="bi bi-eye" id="toggle-icon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login" id="login-btn">
          <span id="login-spinner" class="spinner-border spinner-border-sm me-2 d-none"
                style="width:0.85rem;height:0.85rem;border-color:var(--bg-base);border-right-color:transparent;"></span>
          <i class="bi bi-box-arrow-in-right me-1" id="login-icon"></i>
          Đăng nhập
        </button>
      </form>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      © 2026 <span>WAREHOUSE_AI</span> — Đồ án môn học // <span>STABLE_BUILD</span>
      <div style="margin-top:0.75rem;"><a href="vendor-login.html" style="color:var(--accent-yellow);text-decoration:none;">Đăng nhập dành cho nhà cung cấp <i class="bi bi-arrow-up-right"></i></a></div>
      <div style="margin-top:0.5rem;"><a href="buyer-portal.html" style="color:var(--accent-yellow);text-decoration:none;">Đặt mua hàng không cần đăng nhập <i class="bi bi-arrow-up-right"></i></a></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    /* Nếu đã có token → redirect ngay vào dashboard */
    if (localStorage.getItem('access_token')) {
      window.location.href = 'dashboard.html';
    }

    /* Toggle hiển thị mật khẩu */
    document.getElementById('toggle-pwd').addEventListener('click', function () {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('toggle-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
      }
    });

    /* Hiển thị thông báo lỗi */
    function showError(msg) {
      document.getElementById('login-error-msg').textContent = msg;
      document.getElementById('login-error').classList.remove('d-none');
    }

    /* Dịch error_code sang thông báo tiếng Việt */
    function translateError(err) {
      const map = {
        INVALID_CREDENTIALS: 'Sai tên đăng nhập hoặc mật khẩu.',
        ACCOUNT_INACTIVE: 'Tài khoản đã bị vô hiệu hóa. Vui lòng liên hệ quản trị viên.',
        MISSING_FIELDS: 'Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.',
      };
      return map[err.error_code] || err.message || 'Đã xảy ra lỗi, vui lòng thử lại.';
    }

    /* Xử lý submit form đăng nhập */
    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      document.getElementById('login-error').classList.add('d-none');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.');
        return;
      }

      /* Hiện spinner */
      const loginBtn = document.getElementById('login-btn');
      document.getElementById('login-spinner').classList.remove('d-none');
      document.getElementById('login-icon').classList.add('d-none');
      loginBtn.disabled = true;

      try {
        const res = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          const err = new Error(data.message || 'Login failed');
          err.error_code = data.error_code;
          throw err;
        }

        /* Lưu thông tin đăng nhập vào localStorage */
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('user_role', data.role);
        localStorage.setItem('user_info', JSON.stringify(data.user));

        /* Redirect vào dashboard */
        window.location.href = 'dashboard.html';
      } catch (err) {
        showError(translateError(err));
      } finally {
        document.getElementById('login-spinner').classList.add('d-none');
        document.getElementById('login-icon').classList.remove('d-none');
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
