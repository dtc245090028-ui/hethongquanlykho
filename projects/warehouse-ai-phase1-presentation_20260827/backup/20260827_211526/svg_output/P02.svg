<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><text x="64" y="70" font-family="Aptos" font-size="16" fill="#00A6A6">01 · KẾT LUẬN</text><text x="64" y="130" font-family="Aptos Display" font-size="40" font-weight="bold" fill="#12323A">Bức tranh KT1 trong một trang</text><line x1="64" y1="164" x2="1216" y2="164" stroke="#12323A" stroke-width="2"/><rect x="64" y="210" width="700" height="390" fill="#E9EFEA"/><text x="96" y="255" font-family="Aptos Display" font-size="28" font-weight="bold" fill="#00A6A6">ĐẠT NỀN TẢNG</text><text x="96" y="305" font-family="Aptos" font-size="22" fill="#263238">• Phân tích nghiệp vụ kho</text><text x="96" y="350" font-family="Aptos" font-size="22" fill="#263238">• Thiết kế dữ liệu và ràng buộc</text><text x="96" y="395" font-family="Aptos" font-size="22" fill="#263238">• Actor và phân quyền cơ bản</text><text x="96" y="440" font-family="Aptos" font-size="22" fill="#263238">• Hai chức năng AI và prototype</text><text x="96" y="485" font-family="Aptos" font-size="22" fill="#263238">• Backend, frontend, database, test</text><rect x="804" y="210" width="412" height="390" fill="#FBE5DE"/><text x="836" y="255" font-family="Aptos Display" font-size="28" font-weight="bold" fill="#F26B4F">CHƯA HOÀN TẤT</text><text x="836" y="305" font-family="Aptos" font-size="22" fill="#263238">• Thiếu bộ tài liệu KT1 riêng</text><text x="836" y="350" font-family="Aptos" font-size="22" fill="#263238">• ERD chưa tách thành artifact</text><text x="836" y="395" font-family="Aptos" font-size="22" fill="#263238">• Use case và role chưa thống nhất</text><text x="836" y="440" font-family="Aptos" font-size="22" fill="#263238">• Wireframe chưa đóng gói riêng</text><text x="836" y="485" font-family="Aptos" font-size="22" fill="#263238">• Một số yêu cầu còn rộng</text><text x="64" y="658" font-family="Aptos" font-size="16" fill="#263238">Kết luận: nền tảng đã có, hồ sơ bàn giao cần hoàn thiện.</text></svg>