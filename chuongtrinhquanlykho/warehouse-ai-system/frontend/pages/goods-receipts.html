<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Phiếu nhập kho — Quản lý Kho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
  <div id="sidebar-container"></div>
  <div id="main-wrapper">
    <div id="topbar-container"></div>
    <main id="page-content">
      <div class="card mb-3">
        <div class="card-body py-2">
          <div class="row g-2 align-items-center">
            <div class="col-6 col-md-3">
              <input type="date" id="date-from" class="form-control form-control-sm" placeholder="Từ ngày"/>
            </div>
            <div class="col-6 col-md-3">
              <input type="date" id="date-to" class="form-control form-control-sm" placeholder="Đến ngày"/>
            </div>
            <div class="col-6 col-md-2">
              <input type="number" id="supplier-filter" class="form-control form-control-sm" placeholder="ID NCC"/>
            </div>
            <div class="col-auto ms-md-auto">
              <button class="btn btn-primary btn-sm" id="btn-add">
                <i class="bi bi-plus-lg me-1"></i>Lập phiếu nhập
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th>Mã phiếu</th>
                  <th>NCC ID</th>
                  <th class="d-none d-md-table-cell">PO ID</th>
                  <th>Ngày nhận</th>
                  <th class="d-none d-md-table-cell">Người lập</th>
                  <th class="d-none d-lg-table-cell">Ghi chú</th>
                  <th class="table-actions">Hành động</th>
                </tr>
              </thead>
              <tbody id="receipts-tbody">
                <tr><td colspan="7" class="text-center py-4 text-muted">Đang tải...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="card-footer"><div id="pagination-container"></div></div>
      </div>
    </main>
  </div>

  <!-- Modal Lập phiếu nhập -->
  <div class="modal fade" id="receipt-modal" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Lập phiếu nhập kho</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="form-error" class="alert alert-danger d-none py-2"></div>
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label required">Nhà cung cấp</label>
              <select id="f-supplier" class="form-select" required>
                <option value="">Đang tải nhà cung cấp...</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">ID Đơn đặt hàng (PO)</label>
              <input type="number" id="f-po" class="form-control" min="1" placeholder="Tùy chọn"/>
            </div>
            <div class="col-md-4">
              <label class="form-label required">Ngày nhận hàng</label>
              <input type="datetime-local" id="f-date" class="form-control" required/>
            </div>
            <div class="col-12">
              <label class="form-label">Ghi chú</label>
              <input type="text" id="f-note" class="form-control" placeholder="Ghi chú phiếu nhập..."/>
            </div>
          </div>
          <hr/>
          <div class="d-flex justify-content-between align-items-center mb-2">
            <strong>Danh sách hàng nhập</strong>
            <button type="button" class="btn btn-sm btn-outline-primary" id="btn-add-item">
              <i class="bi bi-plus-lg me-1"></i>Thêm dòng
            </button>
          </div>
          <div class="table-responsive">
            <table class="table table-bordered table-sm">
              <thead class="table-light">
                <tr><th>Hàng hóa</th><th>Số lượng nhập</th><th>Đơn giá nhập (VND)</th><th style="width:50px"></th></tr>
              </thead>
              <tbody id="items-tbody"></tbody>
            </table>
          </div>
          <div class="alert alert-info py-2 small mt-2">
            <i class="bi bi-info-circle me-1"></i>
            Đơn giá nhập sẽ được lưu cố định tại thời điểm nhập (snapshot), dùng để tính giá vốn tồn kho.
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="button" class="btn btn-primary" id="btn-save">
            <span id="save-spinner" class="spinner-border spinner-border-sm me-1 d-none"></span>Lập phiếu
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal chi tiết -->
  <div class="modal fade" id="detail-modal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detail-title">Chi tiết phiếu nhập</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="detail-body">Đang tải...</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    /* ========= Phiếu nhập kho ========= */
    let currentPage = 1;
    const PAGE_SIZE = 20;
    let goodsOptions = [];
    let pendingOfferId = null;
    const receiptModal = new bootstrap.Modal(document.getElementById('receipt-modal'));
    const detailModal  = new bootstrap.Modal(document.getElementById('detail-modal'));

    async function loadGoodsOptions() {
      const data = await api.get('/goods', { page: 1, page_size: 1000, status: 'active' });
      goodsOptions = data.data || [];
    }

    async function loadSupplierOptions() {
      const data = await api.get('/suppliers', { page: 1, page_size: 1000, status: 'active' });
      const suppliers = data.data || [];
      const select = document.getElementById('f-supplier');
      select.innerHTML = '<option value="">Chọn nhà cung cấp</option>' + suppliers.map(supplier => `
        <option value="${supplier.id}">${utils.escapeHtml(supplier.name)}</option>`).join('');
    }

    function goodsOptionsHtml() {
      return '<option value="">Chọn hàng hóa</option>' + goodsOptions.map(goods => `
        <option value="${goods.id}" data-unit="${utils.escapeHtml(goods.unit)}" data-stock="${goods.quantity_on_hand}">
          ${utils.escapeHtml(goods.name)}
        </option>`).join('');
    }

    async function loadReceipts(page = 1) {
      currentPage = page;
      const date_from   = document.getElementById('date-from').value;
      const date_to     = document.getElementById('date-to').value;
      const supplier_id = document.getElementById('supplier-filter').value;
      document.getElementById('receipts-tbody').innerHTML =
        '<tr><td colspan="7" class="text-center py-4 text-muted">Đang tải...</td></tr>';
      try {
        const params = { page, page_size: PAGE_SIZE };
        if (date_from) params.date_from = date_from + 'T00:00:00';
        if (date_to)   params.date_to   = date_to   + 'T23:59:59';
        if (supplier_id) params.supplier_id = supplier_id;
        const data = await api.get('/goods-receipts', params);
        renderTable(data.data || []);
        utils.renderPagination('pagination-container', data.total, page, PAGE_SIZE, loadReceipts);
      } catch (err) {
        document.getElementById('receipts-tbody').innerHTML =
          `<tr><td colspan="7" class="text-danger text-center py-4">Lỗi: ${utils.escapeHtml(err.message)}</td></tr>`;
      }
    }

    function renderTable(items) {
      if (!items.length) {
        document.getElementById('receipts-tbody').innerHTML =
          '<tr><td colspan="7" class="text-center py-4 text-muted">Không có dữ liệu</td></tr>';
        return;
      }
      document.getElementById('receipts-tbody').innerHTML = items.map(r => `
        <tr>
          <td><strong>#${r.id}</strong></td>
          <td>${r.supplier_id}</td>
          <td class="d-none d-md-table-cell">${r.po_id || '—'}</td>
          <td>${utils.formatDate(r.received_date)}</td>
          <td class="d-none d-md-table-cell">${r.created_by}</td>
          <td class="d-none d-lg-table-cell">${utils.truncate(r.note || '—', 30)}</td>
          <td class="table-actions">
            <button class="btn btn-outline-secondary btn-sm" onclick="viewDetail(${r.id})" title="Chi tiết">
              <i class="bi bi-eye"></i>
            </button>
          </td>
        </tr>`).join('');
    }

    async function viewDetail(id) {
      document.getElementById('detail-body').innerHTML = '<div class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></div>';
      document.getElementById('detail-title').textContent = `Phiếu nhập #${id}`;
      detailModal.show();
      try {
        const r = await api.get(`/goods-receipts/${id}`);
        if (!goodsOptions.length) await loadGoodsOptions();
        const itemsHtml = (r.items || []).map((it, i) => `
          <tr>
            <td>${i+1}</td>
            <td>${utils.escapeHtml(goodsOptions.find(g => String(g.id) === String(it.goods_id))?.name || 'Không xác định')}</td>
            <td>${utils.formatQty(it.quantity)}</td>
            <td>${utils.formatCurrency(it.unit_price)}</td>
            <td>${utils.formatCurrency(it.quantity * it.unit_price)}</td>
          </tr>`).join('');
        document.getElementById('detail-body').innerHTML = `
          <div class="row mb-3">
            <div class="col-md-6">
              <table class="table table-borderless mb-0 small">
                <tr><th>Nhà cung cấp ID:</th><td>${r.supplier_id}</td></tr>
                <tr><th>PO ID:</th><td>${r.po_id || '—'}</td></tr>
                <tr><th>Ngày nhận:</th><td>${utils.formatDateTime(r.received_date)}</td></tr>
                <tr><th>Người lập:</th><td>${r.created_by}</td></tr>
                <tr><th>Ghi chú:</th><td>${utils.escapeHtml(r.note || '—')}</td></tr>
              </table>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-sm table-bordered">
              <thead class="table-light"><tr><th>#</th><th>Hàng hóa</th><th>SL nhập</th><th>Đơn giá</th><th>Thành tiền</th></tr></thead>
              <tbody>${itemsHtml}</tbody>
            </table>
          </div>`;
      } catch (err) {
        document.getElementById('detail-body').innerHTML = `<div class="text-danger">Lỗi: ${utils.escapeHtml(err.message)}</div>`;
      }
    }

    function addItemRow() {
      const tbody = document.getElementById('items-tbody');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><select class="form-select form-select-sm" name="goods_id">${goodsOptionsHtml()}</select></td>
        <td><div class="issue-quantity-control"><input type="number" class="form-control form-control-sm" name="qty" min="0.001" step="any" value="1" placeholder="Số lượng"/><span class="issue-stock-hint">Đang có: —</span></div></td>
        <td><input type="number" class="form-control form-control-sm" name="price" min="0" step="any" value="0" placeholder="Đơn giá"/></td>
        <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">
          <i class="bi bi-trash"></i></button></td>`;
      tbody.appendChild(tr);
    }

    document.getElementById('items-tbody').addEventListener('change', event => {
      if (event.target.name !== 'goods_id') return;
      const option = event.target.selectedOptions[0];
      const hint = event.target.closest('tr').querySelector('.issue-stock-hint');
      hint.textContent = option.value ? `Đang có: ${utils.formatQty(option.dataset.stock)} ${option.dataset.unit}` : 'Đang có: —';
    });

    document.getElementById('btn-add-item').addEventListener('click', addItemRow);

    async function openOfferAsReceipt() {
      const rawOffer = sessionStorage.getItem('pending_supplier_offer');
      if (!rawOffer || !new URLSearchParams(window.location.search).has('from_offer')) return;
      sessionStorage.removeItem('pending_supplier_offer');
      const offer = JSON.parse(rawOffer);
      pendingOfferId = offer.id;
      document.getElementById('f-po').value = '';
      document.getElementById('f-date').value = new Date().toISOString().slice(0, 16);
      document.getElementById('f-note').value = `Nhập theo chào bán #${offer.id}`;
      document.getElementById('items-tbody').innerHTML = '';
      document.getElementById('form-error').classList.add('d-none');
      try {
        await Promise.all([loadGoodsOptions(), loadSupplierOptions()]);
        document.getElementById('f-supplier').value = String(offer.supplier_id);
        addItemRow();
        const row = document.getElementById('items-tbody').lastElementChild;
        row.querySelector('[name=goods_id]').value = String(offer.goods_id);
        row.querySelector('[name=qty]').value = offer.quantity_available;
        row.querySelector('[name=price]').value = offer.proposed_price;
        row.querySelector('[name=goods_id]').dispatchEvent(new Event('change'));
        receiptModal.show();
      } catch (err) {
        const error = document.getElementById('form-error');
        error.textContent = 'Không thể mở chào bán thành phiếu nhập: ' + err.message;
        error.classList.remove('d-none');
        receiptModal.show();
      }
    }

    document.getElementById('btn-add').addEventListener('click', async () => {
      document.getElementById('f-supplier').value = '';
      document.getElementById('f-po').value = '';
      document.getElementById('f-date').value = new Date().toISOString().slice(0, 16);
      document.getElementById('f-note').value = '';
      pendingOfferId = null;
      document.getElementById('items-tbody').innerHTML = '';
      document.getElementById('form-error').classList.add('d-none');
      try {
        await Promise.all([loadGoodsOptions(), loadSupplierOptions()]);
        addItemRow();
        receiptModal.show();
      } catch (err) {
        const errDiv = document.getElementById('form-error');
        errDiv.textContent = 'Không thể tải danh sách hàng hóa: ' + err.message;
        errDiv.classList.remove('d-none');
        receiptModal.show();
      }
    });

    document.getElementById('btn-save').addEventListener('click', async () => {
      const supplierId = document.getElementById('f-supplier').value;
      const poId       = document.getElementById('f-po').value;
      const date       = document.getElementById('f-date').value;
      const note       = document.getElementById('f-note').value.trim();
      const errDiv = document.getElementById('form-error');
      errDiv.classList.add('d-none');

      if (!supplierId || !date) {
        errDiv.textContent = 'Vui lòng chọn nhà cung cấp và nhập Ngày nhận hàng.';
        errDiv.classList.remove('d-none');
        return;
      }

      const rows = document.getElementById('items-tbody').rows;
      if (!rows.length) {
        errDiv.textContent = 'Phiếu nhập phải có ít nhất 1 mặt hàng.';
        errDiv.classList.remove('d-none');
        return;
      }

      const items = [];
      for (const row of rows) {
        const goods_id = row.querySelector('[name=goods_id]').value;
        const qty      = parseFloat(row.querySelector('[name=qty]').value);
        const price    = parseFloat(row.querySelector('[name=price]').value);
        if (!goods_id || isNaN(qty) || qty <= 0) {
          errDiv.textContent = 'Mỗi dòng phải chọn hàng hóa và có số lượng > 0.';
          errDiv.classList.remove('d-none');
          return;
        }
        if (isNaN(price) || price < 0) {
          errDiv.textContent = 'Đơn giá nhập không được âm.';
          errDiv.classList.remove('d-none');
          return;
        }
        items.push({ goods_id: parseInt(goods_id), quantity: qty, unit_price: price });
      }

      document.getElementById('save-spinner').classList.remove('d-none');
      document.getElementById('btn-save').disabled = true;

      try {
        const body = {
          supplier_id: parseInt(supplierId),
          received_date: new Date(date).toISOString(),
          items,
        };
        if (poId) body.po_id = parseInt(poId);
        if (note) body.note = note;
        if (pendingOfferId) body.offer_id = pendingOfferId;

        await api.post('/goods-receipts', body);
        utils.showToast('Lập phiếu nhập kho thành công! Tồn kho đã được cập nhật.', 'success');
        receiptModal.hide();
        pendingOfferId = null;
        loadReceipts(currentPage);
      } catch (err) {
        errDiv.textContent = 'Lỗi: ' + err.message;
        errDiv.classList.remove('d-none');
      } finally {
        document.getElementById('save-spinner').classList.add('d-none');
        document.getElementById('btn-save').disabled = false;
      }
    });

    document.getElementById('date-from').addEventListener('change', () => loadReceipts(1));
    document.getElementById('date-to').addEventListener('change', () => loadReceipts(1));
    document.getElementById('supplier-filter').addEventListener('input', utils.debounce(() => loadReceipts(1), 400));

    async function initGoodsReceiptsPage() {
      setPageTitle('Phiếu nhập kho');
      loadReceipts(1);
      openOfferAsReceipt();
    }
    window.initPage = initGoodsReceiptsPage;

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGoodsReceiptsPage, { once: true });
    }
  </script>
</body>
</html>
