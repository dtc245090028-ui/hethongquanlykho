<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><text x="64" y="70" font-family="Aptos" font-size="16" fill="#00A6A6">03 · AI VÀ PROTOTYPE</text><text x="64" y="130" font-family="Aptos Display" font-size="40" font-weight="bold" fill="#12323A">Giao diện đã là prototype, chưa là bộ wireframe bàn giao</text><line x1="64" y1="164" x2="1216" y2="164" stroke="#12323A" stroke-width="2"/><rect x="64" y="220" width="650" height="340" fill="#12323A"/><rect x="96" y="250" width="586" height="42" fill="#E9EFEA"/><rect x="96" y="316" width="170" height="86" fill="#00A6A6"/><rect x="286" y="316" width="170" height="86" fill="#E9EFEA"/><rect x="476" y="316" width="206" height="86" fill="#E9EFEA"/><rect x="96" y="430" width="280" height="88" fill="#E9EFEA"/><rect x="396" y="430" width="286" height="88" fill="#FBE5DE"/><text x="96" y="600" font-family="Aptos" font-size="18" fill="#263238">Dashboard silhouette: metric strip · phiếu gần nhất · cảnh báo</text><text x="760" y="240" font-family="Aptos Display" font-size="28" font-weight="bold" fill="#00A6A6">ĐỘ PHỦ MÀN HÌNH</text><text x="760" y="292" font-family="Aptos" font-size="21" fill="#263238">Đăng nhập · Dashboard · Hàng hóa</text><text x="760" y="330" font-family="Aptos" font-size="21" fill="#263238">Nhà cung cấp · PO · Phiếu nhập</text><text x="760" y="368" font-family="Aptos" font-size="21" fill="#263238">Phiếu xuất · Kiểm kê</text><text x="760" y="406" font-family="Aptos" font-size="21" fill="#263238">Hóa đơn/công nợ · Báo cáo</text><text x="760" y="444" font-family="Aptos" font-size="21" fill="#263238">AI Trợ lý</text><line x1="760" y1="490" x2="1180" y2="490" stroke="#F26B4F" stroke-width="3"/><text x="760" y="540" font-family="Aptos Display" font-size="25" font-weight="bold" fill="#F26B4F">Gap hồ sơ</text><text x="760" y="580" font-family="Aptos" font-size="20" fill="#263238">Chưa có wireframe riêng và</text><text x="760" y="612" font-family="Aptos" font-size="20" fill="#263238">thuyết minh quyết định UI.</text></svg>